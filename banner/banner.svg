<style>
.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:Consolas,'SF Mono',Menlo,'Courier New',monospace}
.eyebrow{font-size:13px;font-weight:600;fill:#7dd3fc;letter-spacing:3.5px}
.name{font-size:56px;font-weight:700;fill:url(#nameGrad);letter-spacing:.5px}
.role{font-size:21px;font-weight:600;fill:#94a3b8;letter-spacing:6px}
.code{font-size:16px;fill:#cbd5e1}
.ln{font-size:13px;fill:#475569}
.kw{fill:#c084fc}.pr{fill:#38bdf8}.st{fill:#34d399}.pn{fill:#94a3b8}
.cd{fill:#111c30;stroke:var(--c);stroke-opacity:.55}
.ct{fill:var(--c);opacity:.07}
.w{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.lt{font-size:15px;font-weight:800;text-anchor:end}
.gl{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.18}
.a{stroke:#7dd3fc}.b{stroke:#a5b4fc}
.in{opacity:0;animation:rise .8s ease-out forwards}
.blob1{animation:drift 14s ease-in-out infinite alternate}
.blob2{animation:drift 18s ease-in-out infinite alternate-reverse}
.wave1{animation:sway 14s ease-in-out infinite alternate}
.wave2{animation:sway 20s ease-in-out infinite alternate-reverse}
.breath{animation:breath 6s ease-in-out infinite alternate}
.cursor{animation:blink 1s steps(1) infinite}
.bar,.eline{transform-box:fill-box;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.fr,.fl,.fu{animation:flow var(--d) var(--t) linear infinite}
.fr{--x:1320px;--y:0px}.fl{--x:-1320px;--y:0px}.fu{--x:0px;--y:-860px}
@keyframes rise{to{opacity:1}}
@keyframes drift{from{transform:translate(-25px,0)}to{transform:translate(25px,12px)}}
@keyframes sway{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
@keyframes breath{from{opacity:.55}}
@keyframes blink{50%{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{0%{transform:translate(0,0);opacity:0}6%,94%{opacity:1}100%{transform:translate(var(--x),var(--y));opacity:0}}
</style>
